plugins {
    id "com.android.application"
}

android {
    namespace "com.cabfare.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.cabfare.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
